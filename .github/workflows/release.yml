name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build artifacts for (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  # Resolve once so all jobs build the same revision.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build portable INKCOPY.exe
        run: python -m PyInstaller --noconfirm --clean INKCOPY.spec

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path inkcopy.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Building NSIS installer for version $ver"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DAPP_VERSION=$ver" "scripts\installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.RELEASE_TAG }}
          path: |
            dist/INKCOPY.exe
            dist/INKCOPY-Setup-*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Generate .icns
        run: bash scripts/build_icns.sh

      - name: Build INKCOPY.app
        run: python -m PyInstaller --noconfirm --clean INKCOPY.spec

      - name: Package DMG (ad-hoc codesign + drag-to-Applications layout)
        # --skip-build = reuse the .app we just built. The script itself ad-hoc
        # codesigns the bundle (codesign --force --deep --sign -) which is what
        # keeps macOS TCC entries stable across rebuilds — the root cause of
        # the "toggle ON but Cmd+V silently fails" report on the previous build.
        run: bash scripts/build_dmg.sh --skip-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ env.RELEASE_TAG }}
          path: dist/INKCOPY-v*.dmg

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-${{ env.RELEASE_TAG }}
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-${{ env.RELEASE_TAG }}
          path: artifacts/

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload to release (creates release if missing, replaces existing assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="${RELEASE_TAG}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found — creating."
            gh release create "$TAG" \
              --title "INKCOPY $TAG" \
              --generate-notes
          else
            echo "Release $TAG already exists — uploading assets with --clobber."
          fi
          gh release upload "$TAG" artifacts/* --clobber
