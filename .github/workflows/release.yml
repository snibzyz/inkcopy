name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build artifacts for (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  python-windows:
    name: Python Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Python portable exe
        run: python -m PyInstaller --noconfirm --clean INKCOPY.spec

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build Python installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path inkcopy.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DAPP_VERSION=$ver" "scripts\installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }

      - name: Create Python Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item dist\INKCOPY.exe artifacts\INKCOPY-Python-Windows-${env:RELEASE_TAG}.exe
          Copy-Item dist\INKCOPY-Setup-*.exe artifacts\
          Compress-Archive -Path artifacts\INKCOPY-Python-Windows-${env:RELEASE_TAG}.exe -DestinationPath artifacts\INKCOPY-Python-Windows-${env:RELEASE_TAG}.zip -Force

      - name: Upload Python Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-windows-${{ env.RELEASE_TAG }}
          path: artifacts/*

  python-macos:
    name: Python macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Generate .icns
        run: bash scripts/build_icns.sh

      - name: Build Python app
        run: python -m PyInstaller --noconfirm --clean INKCOPY.spec

      - name: Package Python DMG
        run: bash scripts/build_dmg.sh --skip-build

      - name: Create Python macOS zip and source zip
        run: |
          set -e
          chmod +x scripts/start-python-mac.command scripts/run.sh scripts/install.sh scripts/build.sh scripts/build_dmg.sh
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/INKCOPY.app "artifacts/INKCOPY-Python-macOS-${RELEASE_TAG}.zip"
          cp dist/INKCOPY-v*.dmg artifacts/
          SRC="artifacts/source/INKCOPY-Python-Source-${RELEASE_TAG}"
          mkdir -p "$SRC/assets" "$SRC/docs" "$SRC/scripts"
          cp inkcopy.py requirements.txt README.md INKCOPY.spec "$SRC/"
          cp "Start INKCOPY Python.command" "Start INKCOPY Python.bat" "$SRC/"
          cp scripts/run.sh scripts/run.bat scripts/install.sh scripts/install.bat "$SRC/scripts/"
          cp scripts/build.sh scripts/build.bat scripts/build_dmg.sh scripts/build_icns.sh scripts/build_nsis.bat scripts/installer.nsi "$SRC/scripts/"
          cp assets/inkcopy.png assets/inkcopy.ico "$SRC/assets/"
          cp docs/* "$SRC/docs/"
          chmod +x "$SRC/Start INKCOPY Python.command" "$SRC/scripts/"*.sh
          ditto -c -k "$SRC" "artifacts/INKCOPY-Python-Source-macOS-Windows-${RELEASE_TAG}.zip"

      - name: Upload Python macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-macos-${{ env.RELEASE_TAG }}
          path: artifacts/*

  # KNOWN BROKEN as of 2026-07-19, and deliberately non-blocking -- see the
  # `publish` job's `if:`. Building the uiohook-napi native module fails with
  # "Could not find any Visual Studio installation to use": GitHub moved its
  # Windows images to Visual Studio 2026, and node-gyp 9.4.1 (pinned in the
  # lockfile via @electron/rebuild 3.6.1) only detects up to VS2022. This same
  # job passed on 2026-06-12 under the older image.
  #
  # Pinning `runs-on` does NOT help: windows-latest and windows-2025 both now
  # resolve to the windows-2025-vs2026 image (verified, not assumed). The real
  # fix is a pnpm override bumping node-gyp to v11, which means regenerating
  # the lockfile -- deferred because the Electron shell is frozen at 0.3.1 and
  # its artifacts are unchanged since that release.
  electron-windows:
    name: Electron Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Electron deps
        run: pnpm install --frozen-lockfile

      - name: Build Electron Windows artifacts
        run: pnpm --filter @inkcopy/desktop-shell package:win

      - name: Stage Electron Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item .app\shell\release\*.exe artifacts\
          Copy-Item .app\shell\release\*.zip artifacts\

      - name: Upload Electron Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-${{ env.RELEASE_TAG }}
          path: artifacts/*

  electron-macos:
    name: Electron macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Electron deps
        run: pnpm install --frozen-lockfile

      - name: Build Electron macOS artifacts
        run: pnpm --filter @inkcopy/desktop-shell package:mac

      - name: Stage Electron macOS artifacts
        run: |
          mkdir -p artifacts
          cp .app/shell/release/*.dmg artifacts/
          cp .app/shell/release/*.zip artifacts/

      - name: Upload Electron macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos-${{ env.RELEASE_TAG }}
          path: artifacts/*

  publish:
    # Waits for all four builds so any Electron artifact that DID build still
    # gets attached -- but only Python decides whether the release ships.
    # Python is the canonical implementation; the frozen Electron shell must
    # not be able to block a Python bugfix from reaching users, which is
    # exactly what happened to v0.3.2 (both Python builds passed and were
    # discarded because electron-windows failed).
    needs: [python-windows, python-macos, electron-windows, electron-macos]
    if: >-
      always()
      && needs.python-windows.result == 'success'
      && needs.python-macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="${RELEASE_TAG}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "INKCOPY $TAG" --generate-notes
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$TAG" "$asset" -y
            done
          mapfile -d '' FILES < <(find artifacts -maxdepth 1 -type f -print0)
          gh release upload "$TAG" "${FILES[@]}" --clobber
