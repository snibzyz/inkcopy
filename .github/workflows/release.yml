name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build INKCOPY.exe
        run: python -m PyInstaller --noconfirm --clean INKCOPY.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: INKCOPY-windows-${{ github.ref_name }}
          path: dist/INKCOPY.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate .icns
        run: bash scripts/build_icns.sh

      - name: Build INKCOPY.app
        run: python -m PyInstaller --noconfirm --clean INKCOPY.spec

      - name: Package as .dmg
        run: |
          mkdir -p dist/dmg
          cp -R dist/INKCOPY.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create \
            -volname INKCOPY \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            dist/INKCOPY.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: INKCOPY-macos-${{ github.ref_name }}
          path: dist/INKCOPY.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: INKCOPY-windows-${{ github.ref_name }}
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: INKCOPY-macos-${{ github.ref_name }}
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/INKCOPY.exe
            artifacts/INKCOPY.dmg
          generate_release_notes: true
          name: INKCOPY ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
